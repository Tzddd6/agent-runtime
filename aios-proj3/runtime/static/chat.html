<!doctype html>
<html lang="zh-CN" data-theme="ink-classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>对话 · AIOS Runtime</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/guizang.css">
  <link rel="stylesheet" href="/static/workspace.css">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <script src="/static/vendor/katex/katex.min.js" defer></script>
  <script src="/static/markdown.js" defer></script>
  <script src="/static/native-chat.js" defer></script>
</head>
<body class="chat-page">
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="/"><span class="app-mark" aria-hidden="true">A</span> AIOS Runtime</a>
      <nav class="app-nav" aria-label="主导航">
        <a href="/" aria-current="page">对话</a>
        <a href="/console/">工作台</a>
      </nav>
      <div class="app-tools">
        <a class="btn btn-sm" href="/console/?view=models">模型设置</a>
        <select id="themeSwitcher" aria-label="主题" class="theme-switcher">
          <option value="ink-classic">浅色</option>
          <option value="swiss-ikb">蓝色</option>
          <option value="forest-ink">墨绿</option>
          <option value="midnight-ink">深色</option>
        </select>
      </div>
    </div>
  </header>

  <div class="chat-layout">
    <aside class="chat-rail" aria-label="对话历史">
      <button type="button" class="btn" id="newChatBtn">新对话</button>
      <details class="chat-history" id="chatHistory" open>
        <summary>历史会话</summary>
        <div id="convList" class="nav-list"></div>
      </details>
    </aside>

    <main class="chat-main">
      <div class="chat-status-line">
        <span id="currConvLabel">新对话</span>
        <span id="chatModelBadge">读取模型配置中</span>
      </div>
      <section id="chatIntro" class="chat-intro">
        <h1>开始对话</h1>
        <p>输入问题，或试试工作台里的执行场景。</p>
        <div class="feature-grid">
          <a class="feature-tile" href="/console/?preset=engineering">
            <strong>工程修复</strong><span>运行测试，下载补丁</span>
          </a>
          <a class="feature-tile" href="/console/?preset=engineering&amp;demo=recovery">
            <strong>断点恢复</strong><span>中断后沿用原补丁</span>
          </a>
          <a class="feature-tile" href="/console/?preset=workflow_scheduling">
            <strong>调度对照</strong><span>比较 FIFO、DRF 和关键路径</span>
          </a>
        </div>
      </section>
      <div id="messagesBox" class="chat-messages"></div>

      <form id="chatForm" class="composer">
        <textarea id="chatPrompt" rows="3" aria-label="消息" placeholder="输入消息…" required></textarea>
        <div class="composer-tools">
          <input id="chatAttachment" class="visually-hidden" type="file" multiple
                 accept=".png,.jpg,.jpeg,.webp,.bmp,.pdf,.docx,.txt,.md,.py,.csv,.json">
          <label for="chatAttachment" class="btn btn-sm" id="chatAttachmentLabel">添加附件</label>
          <label for="chatMode" class="visually-hidden">对话模式</label>
          <select id="chatMode" class="chat-mode" aria-describedby="chatModeHint">
            <option value="llm">直接问答</option>
            <option value="auto">工具助手</option>
            <option value="team">协作分析</option>
            <option value="engineering">工程修复</option>
            <option value="lsfs">文件操作</option>
          </select>
          <details class="composer-options">
            <summary>上下文</summary>
            <label class="check-line"><input type="checkbox" id="useKnowledgeToggle"> 引用知识库</label>
            <label class="check-line"><input type="checkbox" id="useAmemToggle"> 使用记忆</label>
          </details>
          <button class="btn btn-accent" type="submit" id="sendChatBtn">发送</button>
        </div>
        <p id="chatModeHint" class="hint"></p>
        <p id="chatFeedback" class="hint chat-feedback" role="status"></p>
      </form>
    </main>
  </div>
</body>
</html>
